name: 每日市场晨报（云端兜底）

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00，周一至周五
    # ⚠️ 本地自动化 08:00 启动，约 08:45-09:00 完成并写入双向去重标记。
    #    本链路在其后探测标记：标记已 done 即跳过，避免重复推送。
    - cron: '0 1 * * 1-5'
  workflow_dispatch:   # 允许在 Actions 页面手动触发测试

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 统一时区为北京时间，避免 main.py 与 shell date 取到不同日期
      TZ: Asia/Shanghai
      PAGES_BASE: https://cche88.github.io/market-report
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ╔══════════════════════════════════════════════════════════════╗
      # ║ 双向去重 gate：桌面端与云端共用 gh-pages 上的                     ║
      # ║   pushed-YYYY-MM-DD.json 作为「今日推送已完成」的唯一事实来源。  ║
      # ║ 规则：                                                          ║
      # ║   - 标记 status=done            -> 今日已由某端完成，跳过        ║
      # ║   - 标记 started/desktop 且<20分 -> 桌面端进行中，继续等待       ║
      # ║   - 标记 started/desktop 且≥20分 -> 桌面端疑似卡死，云端接手      ║
      # ║   - 标记不存在(404)             -> 最多等 12 分钟，仍无则接手     ║
      # ║   - 兜底：标记始终未出现时，探测桌面端 ASCII PDF（旧逻辑）       ║
      # ╚══════════════════════════════════════════════════════════════╝
      - name: 检查双向去重标记（今日是否已推送）
        id: gate
        run: |
          DATE=$(date +%F)
          MARKER_URL="$PAGES_BASE/pushed-$DATE.json"
          PDF_URL="$PAGES_BASE/market-report-$DATE.pdf"
          skip=false
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/marker.json -w "%{http_code}" --max-time 30 "$MARKER_URL")
            echo "[$i/12] $(date '+%H:%M:%S') probe $MARKER_URL -> $code"
            if [ "$code" = "200" ]; then
              status=$(python3 -c "import json,sys;print(json.load(open('/tmp/marker.json')).get('status',''))" 2>/dev/null || true)
              src=$(python3 -c "import json,sys;print(json.load(open('/tmp/marker.json')).get('source',''))" 2>/dev/null || true)
              ts=$(python3 -c "import json,sys;print(json.load(open('/tmp/marker.json')).get('ts',''))" 2>/dev/null || true)
              if [ "$status" = "done" ]; then
                echo "标记显示今日已由 $src 完成推送，云端跳过"
                skip=true; break
              fi
              if [ "$status" = "started" ] && [ "$src" = "desktop" ]; then
                age=$(( ( $(date +%s) - $(date -d "$ts" +%s 2>/dev/null || echo 0) ) / 60 ))
                if [ "$age" -lt 20 ]; then
                  echo "桌面端进行中（${age}分），继续等待标记变为 done"
                else
                  echo "桌面端 started 已超 ${age} 分，云端接手生成"
                  break
                fi
              else
                echo "标记状态=$status/$src，继续等待"
              fi
            else
              echo "标记尚未生成，继续等待（共 12 轮）"
            fi
            if [ "$i" -lt 12 ]; then sleep 60; fi
          done
          # 兜底：标记始终未出现时，沿用旧逻辑探测桌面端 ASCII PDF
          if [ "$skip" != "true" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$PDF_URL")
            if [ "$code" = "200" ]; then
              echo "探测到桌面端已发布研报 PDF，云端跳过"
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: 配置 Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 安装 Chromium（PDF 转换用）
        if: steps.gate.outputs.skip != 'true'
        run: playwright install --with-deps chromium

      - name: 生成研报并推送微信
        if: steps.gate.outputs.skip != 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
        run: python main.py

      - name: 生成 index.html（Pages 首页）
        if: steps.gate.outputs.skip != 'true'
        working-directory: ./output
        run: cp market-report-$(date +%F).html index.html

      - name: 写入去重标记（done/cloud）
        # ⚠️ 必须在「发布」之前写，使 peaceiris 把标记一并带上 gh-pages；
        #    main.py 已成功推送微信后才会执行到本步（上方步骤失败则 job 中止）。
        if: steps.gate.outputs.skip != 'true'
        run: |
          DATE=$(date +%F)
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          CST = timezone(timedelta(hours=8))
          d = {
              "date": os.environ["DATE"],
              "ts": datetime.now(CST).isoformat(timespec="seconds"),
              "source": "cloud",
              "status": "done",
              "flow_id": "cloud-workflow",
              "title": "市场晨报（云端兜底）"
          }
          with open(f"output/pushed-{d['date']}.json", "w", encoding="utf-8") as f:
              json.dump(d, f, ensure_ascii=False, indent=2)
          print("wrote output/pushed-%s.json" % d["date"])
          PY

      - name: 发布到 GitHub Pages
        # ⚠️ 必须带 gate 条件：keep_files=false 会清空 gh-pages，
        #    若跳过生成却仍执行发布，会把线上当日研报删光
        if: steps.gate.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: false
