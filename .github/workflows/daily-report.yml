name: 每日市场晨报

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00，周一至周五
    # 注意：GitHub Actions 高峰期可能延迟数分钟，属正常现象
    - cron: '0 1 * * 1-5'
  workflow_dispatch:   # 允许在 Actions 页面手动触发测试

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 统一时区为北京时间，避免 main.py 与 shell date 取到不同日期
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Chromium（PDF 转换用）
        run: playwright install --with-deps chromium

      - name: 生成研报并推送微信
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
        run: python main.py

      - name: 生成 index.html（Pages 首页）
        working-directory: ./output
        run: cp market-report-$(date +%F).html index.html

      - name: 发布到 GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          # ⚠️ 必须 false：keep_files=true 会让 gh-pages 累积历史研报，
          #    体积累增至数十 MB 后 Pages 同步变慢甚至超时
          keep_files: false
