name: 每日市场晨报（云端兜底）

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00，周一至周五
    # ⚠️ 本地自动化已提前到 08:30（桌面客户端），PDF 约 08:40-08:45 上 Pages。
    #    本链路在其后 30 分钟探测，探测到当日研报即跳过，避免重复推送。
    #    另在 gate 里内置最多 8 分钟宽限期（见下方步骤注释），吸收客户端唤醒抖动。
    - cron: '0 1 * * 1-5'
  workflow_dispatch:   # 允许在 Actions 页面手动触发测试

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 统一时区为北京时间，避免 main.py 与 shell date 取到不同日期
      TZ: Asia/Shanghai
      PAGES_BASE: https://cche88.github.io/market-report
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 兜底判定：本地链路若已发布当日研报，此处直接收工
      # ⚠️ 宽限期说明：本地链路 08:30 启动，数据抓取约 2 分钟、HTML+PDF 约 3 分钟、
      #    发布到 Pages 约 5 分钟，即 PDF 通常 08:40-08:45 才上线。
      #    若客户端唤醒有抖动、09:00 时还没发布，这里再等最多 8 分钟（每 60s 探测一次），
      #    避免两条链路同时生成、用户收到两条重复推送。
      - name: 检查本地链路是否已发布当日研报
        id: gate
        run: |
          url="$PAGES_BASE/market-report-$(date +%F).pdf"
          for i in $(seq 1 9); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url")
            echo "[$i/9] $(date '+%H:%M:%S') probe $url -> $code"
            if [ "$code" = "200" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "本地链路已发布当日研报，云端跳过"
              exit 0
            fi
            if [ "$i" -lt 9 ]; then sleep 60; fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "宽限期内仍未检测到当日研报，云端接手生成"

      - name: 配置 Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 安装 Chromium（PDF 转换用）
        if: steps.gate.outputs.skip != 'true'
        run: playwright install --with-deps chromium

      - name: 生成研报并推送微信
        if: steps.gate.outputs.skip != 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
        run: python main.py

      - name: 生成 index.html（Pages 首页）
        if: steps.gate.outputs.skip != 'true'
        working-directory: ./output
        run: cp market-report-$(date +%F).html index.html

      - name: 发布到 GitHub Pages
        # ⚠️ 必须带 gate 条件：keep_files=false 会清空 gh-pages，
        #    若跳过生成却仍执行发布，会把线上当日研报删光
        if: steps.gate.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: false
